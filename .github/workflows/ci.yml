name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven (compile only)
      run: javac -d build src/*.java

    - name: Run Checkstyle
      uses: nikitasavinov/checkstyle-action@v2
      with:
        checkstyle_config: checkstyle.xml
        checkstyle_version: 10.12.0
        level: error
        source: src/
