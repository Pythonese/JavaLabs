name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with javac
      run: |
        mkdir -p build
        javac -d build src/*.java

    - name: Run Checkstyle
      run: |
        # Скачиваем Checkstyle
        wget https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.0/checkstyle-10.12.0-all.jar

        # Запускаем Checkstyle
        java -jar checkstyle-10.12.0-all.jar -c checkstyle.xml src/

    - name: Test the application
      run: |
        echo "Ivan" | java -cp build Greeting | grep "Hello, Ivan!" && echo "Test passed!" || echo "Test failed!"
